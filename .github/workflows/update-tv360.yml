name: Dong bo URL kenh tu TV360

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Ghi that vao playlist. Bo tick = chi xem thu"
        required: false
        default: "true"
        type: boolean

# QUYEN: doc repo + ghi commit
permissions:
  contents: write

# Neu co 2 lan chay chong nhau, huy ban cu.
concurrency:
  group: dong-bo-tv360
  cancel-in-progress: true

jobs:
  dong-bo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ---------- 1. Lay code ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien can thiet
        run: pip install cryptography

      # ---------- 2. Backup playlist de rollback ----------
      - name: Backup playlist
        run: |
          for f in list.m3u8 Listphu.m3u8; do
            if [ -f "$f" ]; then
              cp -f "$f" "$f.bak"
              echo "Backup $f: $(wc -l < "$f") dong"
            fi
          done

      # ---------- 3. Lay link truc tiep tu TV360 ----------
      # Khong con dung nguon trung gian (vietanhtv.top).
      # Link lay thang tu api.tv360.vn + tv360.vn.
      #
      # Neu may chu co token dang nhap (tv360_session.json), chi lay duoc
      # kenh MIEN PHI. Kenh tra phi can dang nhap -> can secrets.
      - name: Lay link tu TV360
        env:
          TV360_ACCESS_TOKEN: ${{ secrets.TV360_ACCESS_TOKEN }}
          TV360_REFRESH_TOKEN: ${{ secrets.TV360_REFRESH_TOKEN }}
          TV360_MSISDN: ${{ secrets.TV360_MSISDN }}
          TV360_DEVICE_ID: ${{ secrets.TV360_DEVICE_ID }}
        run: |
          if [ -n "$TV360_ACCESS_TOKEN" ]; then
            echo '{"access_token":"'"$TV360_ACCESS_TOKEN"'","refresh_token":"'"$TV360_REFRESH_TOKEN"'","msisdn":"'"$TV360_MSISDN"'","device_id":"'"$TV360_DEVICE_ID"'"}' > tv360_session.json
            echo "Dung token dang nhap tu secrets."
          else
            echo '{"access_token":"","refresh_token":"","msisdn":"","device_id":""}' > tv360_session.json
            echo "::warning::Khong co TV360_ACCESS_TOKEN -> chi lay duoc kenh mien phi."
          fi

      # ---------- 4. Chay dong bo ----------
      - name: Dong bo URL tu TV360
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || 'true' }}
        run: |
          ARGS=""
          if [ "$APPLY" = "true" ]; then ARGS="--apply"; fi
          echo "Che do: ${ARGS:-xem truoc}"
          python sync_tv360.py $ARGS

      # ---------- 5. Bao cao ----------
      - name: Hien bao cao
        if: always()
        run: |
          echo "### Link hien tai trong list.m3u8 ###"
          grep -c '^#EXTINF' list.m3u8 || true
          echo "### mau 5 dong URL ###"
          grep -E '^https?://' list.m3u8 | head -5 | cut -c1-120

      # ---------- 6. Kiem tra an toan, rollback neu hong ----------
      - name: Kiem tra an toan
        if: always()
        run: |
          fail=0
          for f in list.m3u8 Listphu.m3u8; do
            if [ ! -f "$f.bak" ]; then continue; fi

            before=$(wc -l < "$f.bak")
            after=$(wc -l < "$f")

            if [ "$before" != "$after" ]; then
              echo "::error::$f doi so dong ($before -> $after)"
              fail=1
              continue
            fi

            head -1 "$f" | grep -q "EXTM3U" || {
              echo "::error::$f khong con dong #EXTM3U dau tien"
              fail=1
              continue
            }

            # So muc EXTINF khong duoc doi
            b=$(grep -c '^#EXTINF' "$f.bak" || true)
            a=$(grep -c '^#EXTINF' "$f" || true)
            if [ "$b" != "$a" ]; then
              echo "::error::$f doi so muc EXTINF ($b -> $a)"
              fail=1
              continue
            fi

            # Phai co it nhat mot link TV360 (khong con vietanhtv.top)
            if grep -q 'tv\.vietanhtv\.top' "$f"; then
              echo "::warning::$f van con link qua vietanhtv.top"
            fi

            echo "OK: $f ($after dong, khong doi so luong)"
          done

          if [ "$fail" = "1" ]; then
            echo ">>> PHAT HIEN HONG FILE. Khoi phuc ban goc."
            for f in list.m3u8 Listphu.m3u8; do
              if [ -f "$f.bak" ]; then
                mv -f "$f.bak" "$f"
                echo "Da khoi phuc $f"
              fi
            done
            rm -f list.m3u8.tmp Listphu.m3u8.tmp
            exit 1
          fi

      # ---------- 7. Commit ----------
      - name: Commit thay doi
        run: |
          rm -f list.m3u8.bak Listphu.m3u8.bak
          rm -f list.m3u8.tmp Listphu.m3u8.tmp
          rm -f tv360_session.json

          if git diff --quiet -- list.m3u8 Listphu.m3u8; then
            echo "Khong co thay doi. Khong tao commit."
            exit 0
          fi

          if [ ! -s list.m3u8 ] || [ ! -s Listphu.m3u8 ]; then
            echo "::error::Mot trong hai playlist bi rong. Bo qua commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list.m3u8 Listphu.m3u8
          git commit -m "chore: dong bo URL tu TV360 (${{ github.run_number }}) $(date -u +%Y-%m-%dT%H:%MZ)"

          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}"; then
              if git push origin "${{ github.ref_name }}"; then
                echo "Da push."
                exit 0
              fi
            fi
            echo "Push that bai, thu lai lan $i..."
            sleep 5
          done

          echo "::error::Khong push duoc sau 3 lan thu."
          exit 1
